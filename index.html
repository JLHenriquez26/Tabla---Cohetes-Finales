<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competencia de Cohetes Finales - Tabla de Posiciones</title>
    <style>
        :root {
            --bg-dark: #040814;
            --card-bg: rgba(15, 23, 42, 0.85);
            --card-border: rgba(56, 189, 248, 0.25);
            --neon-cyan: #38bdf8;
            --neon-green: #34d399;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(4, 8, 20, 0.75), rgba(4, 8, 20, 0.9)), 
                url('assets/img/bg-space.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .logos-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .logo-tec-img {
            max-height: 60px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4));
        }

        .rocket-logo-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        .title {
            color: var(--neon-cyan);
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            margin-bottom: 0.4rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .sub-header {
            color: var(--neon-cyan);
            font-size: 0.95rem;
            margin-top: 0.2rem;
            font-weight: 600;
        }

        .admin-panel {
            background: var(--card-bg);
            border: 1px solid var(--neon-cyan);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 1.5rem;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
            overflow-x: auto;
        }

        .admin-panel-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .admin-title {
            color: var(--neon-cyan);
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .leaderboard-table th, .leaderboard-table td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--card-border);
        }

        .leaderboard-table th {
            color: var(--neon-cyan);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(56, 189, 248, 0.05);
        }

        .leaderboard-table td {
            font-size: 0.95rem;
        }

        .leaderboard-table tbody tr:hover {
            background: rgba(56, 189, 248, 0.1);
        }

        .error-tag {
            color: var(--neon-green);
            font-weight: bold;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            padding: 1.5rem;
            font-style: italic;
        }

        .music-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 0.6rem 1rem;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .music-toggle:hover { background: rgba(56, 189, 248, 0.15); }
    </style>
</head>
<body>

    <!-- Reproductor de música en bucle -->
    <audio id="bgMusic" src="assets/audio/space-music.mp3" loop preload="auto"></audio>

    <button class="music-toggle" onclick="toggleMusic()" id="musicBtn">
        🎵 <span>Pausar Música</span>
    </button>

    <div class="container">
        <header>
            <div class="logos-wrapper">
                <img src="assets/img/logo-tec.png" alt="Tecnológico de Monterrey" class="logo-tec-img">
                <img src="assets/img/logo-rocket.jpg" alt="Parche Cohete" class="rocket-logo-img">
            </div>

            <h1 class="title">🚀 Competencia de Cohetes Finales 🚀</h1>
            <p class="subtitle">Unidad de Formación F1025B</p>
            <p class="sub-header">Tabla de Posiciones</p>
        </header>

        <div class="admin-panel">
            <div class="admin-panel-header">
                <span class="admin-title">🏆 Tabla de Clasificación</span>
            </div>
            
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>Grupo</th>
                        <th>Equipo</th>
                        <th>Cohete</th>
                        <th>Altura Teórica</th>
                        <th>Altura Sensor</th>
                        <th>Porcentaje Error</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    <!-- Los datos se generan dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const music = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        let isPlaying = false;

        window.addEventListener('DOMContentLoaded', () => {
            music.volume = 0.4;
            music.play().then(() => {
                isPlaying = true;
                musicBtn.innerHTML = "🎵 <span>Pausar Música</span>";
            }).catch(() => {
                isPlaying = false;
                musicBtn.innerHTML = "🔇 <span>Reproducir Música</span>";
            });

            renderLeaderboard();
        });

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                isPlaying = false;
                musicBtn.innerHTML = "🔇 <span>Reproducir Música</span>";
            } else {
                music.play();
                isPlaying = true;
                musicBtn.innerHTML = "🎵 <span>Pausar Música</span>";
            }
        }

        function renderLeaderboard() {
            let teams = JSON.parse(localStorage.getItem('rocket_teams_finales')) || [];
            const tbody = document.getElementById('leaderboardBody');

            if (teams.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty-msg">No hay lanzamientos registrados aún.</td></tr>`;
                return;
            }

            // Calcular porcentaje de error y ordenar de menor a mayor error
            const processedTeams = teams.map(item => {
                const theo = parseFloat(item.theoreticalHeight) || 0;
                const sens = parseFloat(item.sensorHeight) || 0;
                const error = theo > 0 ? Math.abs((theo - sens) / theo) * 100 : 0;
                return { ...item, error };
            }).sort((a, b) => a.error - b.error);

            tbody.innerHTML = processedTeams.map(item => `
                <tr>
                    <td>${item.group || '-'}</td>
                    <td>${item.team || '-'}</td>
                    <td>${item.rocket || '-'}</td>
                    <td>${item.theoreticalHeight} m</td>
                    <td>${item.sensorHeight} m</td>
                    <td class="error-tag">${item.error.toFixed(2)}%</td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
