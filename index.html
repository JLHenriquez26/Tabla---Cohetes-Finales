<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competencia de Cohetes Finales - Registro</title>
    <style>
        :root {
            --bg-dark: #040814;
            --card-bg: rgba(15, 23, 42, 0.85);
            --card-border: rgba(56, 189, 248, 0.25);
            --neon-cyan: #38bdf8;
            --neon-green: #34d399;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(4, 8, 20, 0.75), rgba(4, 8, 20, 0.9)), 
                url('assets/img/bg-space.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .logos-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .logo-tec-img {
            max-height: 60px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4));
        }

        .rocket-logo-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        .title {
            color: var(--neon-cyan);
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            margin-bottom: 0.4rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .sub-header {
            color: var(--neon-cyan);
            font-size: 0.95rem;
            margin-top: 0.2rem;
            font-weight: 600;
        }

        /* Panel de Registro (Siempre visible) */
        .admin-panel {
            background: var(--card-bg);
            border: 1px solid var(--neon-cyan);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 2rem;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
        }

        .admin-panel-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .admin-title {
            color: var(--neon-cyan);
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.2rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .form-group input {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 0.75rem;
            color: var(--text-main);
            outline: none;
            font-size: 1rem;
        }

        .form-group input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }

        .btn-submit {
            background: var(--neon-cyan);
            color: #040814;
            border: none;
            padding: 0.85rem 1.5rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-submit:active { transform: translateY(0); }

        .success-msg {
            display: none;
            background: rgba(52, 211, 153, 0.15);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 0.75rem;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logos-wrapper">
                <img src="assets/img/logo-tec.png" alt="Tecnológico de Monterrey" class="logo-tec-img">
                <img src="assets/img/logo-rocket.jpg" alt="Parche Cohete" class="rocket-logo-img">
            </div>

            <h1 class="title">🚀 Competencia de Cohetes Finales 🚀</h1>
            <p class="subtitle">Unidad de Formación F1025B</p>
            <p class="sub-header">Registro de Lanzamientos</p>
        </header>

        <!-- Panel de Registro de Lanzamientos -->
        <div class="admin-panel">
            <div class="admin-panel-header">
                <span class="admin-title">📝 Registrar Nuevo Lanzamiento</span>
            </div>
            <form id="rocketForm" onsubmit="addTeam(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Grupo</label>
                        <input type="text" id="groupName" required placeholder="Ej: Grupo A">
                    </div>
                    <div class="form-group">
                        <label>Nombre del Equipo</label>
                        <input type="text" id="teamName" required placeholder="Ej: IGNITIA">
                    </div>
                    <div class="form-group">
                        <label>Nombre del Cohete</label>
                        <input type="text" id="rocketName" required placeholder="Ej: Ignitia-1">
                    </div>
                    <div class="form-group">
                        <label>Altura Teórica (m)</label>
                        <input type="number" step="0.01" id="theoreticalHeight" required placeholder="Ej: 150.0">
                    </div>
                    <div class="form-group">
                        <label>Altura Sensor (m)</label>
                        <input type="number" step="0.01" id="sensorHeight" required placeholder="Ej: 145.2">
                    </div>
                </div>
                <button type="submit" class="btn-submit">Guardar Registro</button>
                <div id="successMsg" class="success-msg">¡Registro guardado correctamente en el sistema!</div>
            </form>
        </div>
    </div>

    <script>
        let teams = JSON.parse(localStorage.getItem('rocket_teams')) || [];

        function addTeam(e) {
            e.preventDefault();
            const newTeam = {
                id: Date.now(),
                group: document.getElementById('groupName').value,
                team: document.getElementById('teamName').value,
                rocket: document.getElementById('rocketName').value,
                theoreticalHeight: parseFloat(document.getElementById('theoreticalHeight').value),
                sensorHeight: parseFloat(document.getElementById('sensorHeight').value)
            };

            teams.push(newTeam);
            localStorage.setItem('rocket_teams', JSON.stringify(teams));
            
            document.getElementById('rocketForm').reset();
            
            const msg = document.getElementById('successMsg');
            msg.style.display = 'block';
            setTimeout(() => {
                msg.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
